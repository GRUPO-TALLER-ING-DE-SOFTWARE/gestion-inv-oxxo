name: Send Test Results to TestRail
on: [push]
jobs:
  send-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install dependencies
        run: |
          pip install trcli  # Instalar trcli para subir los resultados a TestRail
          npm install  # Si usas Node.js, instala las dependencias necesarias, si no, omítelo.
        
      - name: Run tests
        run: |
          # Aquí agregas los comandos para ejecutar tus pruebas
          # Por ejemplo, si usas npm, puedes usar algo como:
          npm test -- --reporter=jest-junit  # Asegúrate de que tus pruebas generen un reporte JUnit

      - name: Upload results to TestRail
        run: |
          trcli -y \
            -h https://tu-instancia.testrail.io/ \
            --project 1 \  # Reemplaza '1' con el ID de tu proyecto de TestRail
            -u ${{ secrets.TESTRAIL_EMAIL }} \
            -p ${{ secrets.TESTRAIL_PASSWORD }} \
            parse_junit \
            --title "Automated Test Results" \
            --run-description ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            -f "test-results/junit-report.xml"  # Asegúrate de que esta ruta es correcta